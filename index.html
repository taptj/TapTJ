<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>En mantenimiento</title>
<style>
:root{--bg:#0f2a43;--ink:#fff;--muted:#b9c7d6;--accent:#3ddba3;--line:#1f8f6d;
box-sizing:border-box;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
@media (prefers-color-scheme:dark){:root{--bg:#0f2a43}}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
display:flex;align-items:center;justify-content:center;padding:24px}
main{max-width:420px;width:100%;text-align:center;border:2px solid var(--line);border-radius:24px;padding:40px 28px}
.waves{width:84px;height:84px;margin:0 auto 20px}
.waves .p{animation:pulse 2.4s ease-in-out infinite;transform-origin:14px 42px}
.waves .p:nth-child(3){animation-delay:.3s}.waves .p:nth-child(4){animation-delay:.6s}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.waves .p{animation:none}}
h1{font-size:1.6rem;margin:0 0 12px}
p{color:var(--muted);line-height:1.55;margin:0 0 24px}
a.btn{display:inline-block;background:var(--accent);color:#0f2a43;font-weight:700;text-decoration:none;
padding:14px 24px;border-radius:999px}
a.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.brand{margin-top:28px;font-weight:800;font-size:1.1rem}
.brand span{color:var(--accent)}
</style>
</head>
<body>
<main>
<svg class="waves" viewBox="0 0 84 84" aria-hidden="true">
<circle cx="14" cy="42" r="6" fill="#3ddba3"/>
<path class="p" d="M28 30a16 16 0 0 1 0 24" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<path class="p" d="M40 20a30 30 0 0 1 0 44" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
<path class="p" d="M52 10a44 44 0 0 1 0 64" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
<h1>Estamos en mantenimiento</h1>
<p>Esta página no está disponible por ahora. Si eres el dueño del negocio, escríbenos para reactivarla.</p>
<a class="btn" href="https://wa.me/message/K7GQYRMXBPPXL1">Escribir por WhatsApp</a>
<div class="brand">Tap<span>TJ</span></div>
</main>
</body>
</html>
